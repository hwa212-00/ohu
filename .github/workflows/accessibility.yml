name: Accessibility Audit (aXe-core)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  accessibility-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: @axe-core/cli 설치
        run: npm install -g @axe-core/cli

      - name: aXe 접근성 검사 실행
        run: axe index.html login.html profile.html --exit
