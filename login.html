<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 오후정미소</title>
<meta name="description" content="오후정미소 계정으로 로그인하고 찜한 메뉴와 주문 내역을 확인하세요.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* ===== 메인 페이지와 동일한 디자인 토큰 (일관성 유지) ===== */
  :root{
    --bg: #FBF8F3;
    --bg-alt: #F1E7D5;
    --surface: #FFFFFF;
    --text: #2A2420;
    --text-muted: #5B4F45;
    --primary-dark: #6B3819;
    --accent: #4B5D3A;
    --border: #D9CCB8;
    --border-strong: #B9A183;
    --focus-ring: #B23A1E;
    --footer-bg: #2A2420;
    --footer-text: #F1E7D5;
    --footer-text-muted: #C9BBA8;

    --font-display: "Noto Serif KR", "Malgun Gothic", serif;
    --font-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;

    --scale: 1;
    --container: 26rem;
  }

  html[data-contrast="high"]{
    --bg: #000000;
    --bg-alt: #000000;
    --surface: #000000;
    --text: #FFFFFF;
    --text-muted: #F2F2F2;
    --primary-dark: #FFD166;
    --accent: #8FE3C0;
    --border: #FFFFFF;
    --border-strong: #FFFFFF;
    --focus-ring: #FF7A59;
    --footer-bg: #000000;
    --footer-text: #FFFFFF;
    --footer-text-muted: #FFFFFF;
  }
  html[data-contrast="high"] .btn-primary{
    background: var(--primary-dark);
    color: #000000;
    border-color: var(--primary-dark);
  }
  html[data-contrast="high"] input[aria-invalid="true"]{
    background: #000000;
    border-width: 2px;
  }
  html[data-contrast="high"] .form-status.error{ background:#000000; }
  html[data-contrast="high"] .form-status.success{ background:#000000; }

  *,*::before,*::after{ box-sizing: border-box; }

  html{
    font-size: calc(100% * var(--scale));
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *,*::before,*::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  body{
    margin:0;
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1.0625rem;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1{ font-family: var(--font-display); line-height: 1.3; color: var(--text); }

  a{ color: var(--primary-dark); }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible{
    outline: 3px solid var(--focus-ring);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .skip-link{
    position: absolute;
    left: 1rem;
    top: -4rem;
    background: var(--primary-dark);
    color: #fff;
    padding: 0.85rem 1.25rem;
    border-radius: 0.4rem;
    font-weight: 700;
    z-index: 100;
    transition: top .15s ease;
  }
  .skip-link:focus{ top: 1rem; }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  .container{
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* ===== 헤더 (로그인 페이지는 목적이 분명하므로 탭 없이 최소한만) ===== */
  .site-header{
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .util-bar{
    background: var(--footer-bg);
    color: var(--footer-text);
    --focus-ring: #FFFFFF;
  }
  .util-bar .container{
    max-width: 64rem;
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    justify-content: flex-end;
    gap: 0.5rem;
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
    font-size: 0.85rem;
  }
  .util-btn{
    display:inline-flex;
    align-items:center;
    gap:0.3rem;
    background: transparent;
    color: var(--footer-text);
    border: 1px solid var(--footer-text-muted);
    border-radius: 0.3rem;
    padding: 0.35rem 0.7rem;
    font-size: 0.85rem;
    font-family: var(--font-body);
    cursor: pointer;
  }
  .util-btn:hover{ background: rgba(255,255,255,0.12); }
  .util-btn[aria-pressed="true"]{
    background: var(--footer-text);
    color: var(--footer-bg);
    font-weight: 700;
  }
  .util-status{
    display:inline-flex;
    align-items:center;
    min-width: 4.5rem;
    justify-content:center;
    padding: 0.35rem 0.5rem;
    font-weight: 700;
    color: var(--footer-text);
  }

  .header-inner{
    max-width: 64rem;
    margin: 0 auto;
    padding: 1.1rem 1.5rem;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 1rem;
  }
  .logo{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text);
    text-decoration:none;
    display:flex;
    align-items:baseline;
    gap: 0.5rem;
  }
  .logo:hover{ color: var(--primary-dark); }
  .logo .logo-sub{
    font-family: var(--font-body);
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 400;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap: 0.35rem;
    text-decoration:none;
    color: var(--text-muted);
    font-size: 0.92rem;
    font-weight: 600;
  }
  .back-link:hover{ color: var(--primary-dark); }
  .back-link svg{ width: 1rem; height: 1rem; }

  /* ===== 본문: 로그인 카드 ===== */
  main{ flex: 1 1 auto; display:flex; align-items:center; }
  .login-section{ width: 100%; padding: 3rem 0; }

  .login-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1rem;
    box-shadow: 0 0.75rem 2rem rgba(42,36,32,0.08);
    padding: 2.25rem 2rem;
  }

  .eyebrow{
    display:inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--primary-dark);
    background: rgba(138,74,35,0.10);
    border: 1px solid rgba(138,74,35,0.35);
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.9rem;
  }
  html[data-contrast="high"] .eyebrow{
    background:#000; border:2px solid var(--primary-dark); color:var(--primary-dark);
  }

  .login-card h1{
    font-size: 1.75rem;
    margin: 0 0 0.5rem;
  }
  .login-lede{
    margin: 0 0 1.75rem;
    color: var(--text-muted);
    font-size: 0.98rem;
  }

  .form-row{ margin-bottom: 1.25rem; }
  .form-row label{
    display:block;
    font-weight: 700;
    margin-bottom: 0.45rem;
    font-size: 0.95rem;
  }
  .required-mark{ color: var(--primary-dark); font-weight: 700; }
  .hint{
    display:block;
    font-size: 0.83rem;
    color: var(--text-muted);
    margin-top: 0.35rem;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"]{
    width:100%;
    font: inherit;
    padding: 0.7rem 0.85rem;
    border: 1.5px solid var(--border-strong);
    border-radius: 0.4rem;
    background: var(--bg);
    color: var(--text);
  }
  /* 브라우저 기본 placeholder는 저채도 회색이라 명도 대비가 3:1을 못 넘기는 경우가 많아,
     기존 --text-muted 토큰으로 명시 지정한다 (라이트: 7.48:1, 고대비 모드: 18.76:1 확보) */
  input[type="email"]::placeholder,
  input[type="password"]::placeholder,
  input[type="text"]::placeholder{
    color: var(--text-muted);
    opacity: 1; /* 파이어폭스는 기본적으로 placeholder에 opacity를 적용해 대비를 낮추므로 명시적으로 해제 */
  }
  input[aria-invalid="true"]{
    border-color: var(--focus-ring);
    background: #FCEDE9;
  }

  .error-text{
    display:flex;
    gap: 0.4rem;
    align-items:flex-start;
    color: var(--focus-ring);
    font-size: 0.87rem;
    margin-top: 0.4rem;
    font-weight: 700;
  }

  .password-field{
    position: relative;
  }
  .password-field input{
    padding-right: 3rem;
  }
  .password-toggle{
    position: absolute;
    top: 50%;
    right: 0.4rem;
    transform: translateY(-50%);
    width: 2.2rem;
    height: 2.2rem;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--text-muted);
    cursor: pointer;
  }
  .password-toggle:hover{ background: var(--bg-alt); color: var(--text); }
  .password-toggle svg{ width: 1.15rem; height: 1.15rem; }
  /* hidden 속성 대신 클래스로 표시 여부를 전환한다. 이 프로젝트에서 [hidden]이
     다른 CSS 규칙(예: display:flex)에 우선순위로 밀려 무시되는 문제를 여러 번 겪었어서,
     아예 그런 충돌 여지가 없는 단일 규칙으로 대체한다. */
  .password-toggle svg.icon-off{ display:none; }

  .form-row-inline{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap: 0.5rem;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .checkbox-row input{ width: 1.1rem; height: 1.1rem; }

  .link-btn{
    background: none;
    border: none;
    padding: 0;
    color: var(--primary-dark);
    font: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 0.15em;
    cursor: pointer;
  }
  .link-btn:hover{ color: #52290f; }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    padding: 0.85rem 1.5rem;
    border-radius: 0.5rem;
    text-decoration:none;
    font-weight: 700;
    font-size: 1rem;
    border: 2px solid transparent;
    cursor:pointer;
    font-family: var(--font-body);
  }
  .btn-primary{
    background: var(--primary-dark);
    color: #fff;
  }
  .btn-primary:hover{ background: #52290f; }
  .btn-primary:disabled{
    opacity: 0.65;
    cursor: not-allowed;
  }
  .btn-block{ width: 100%; }

  .form-status{
    border-radius: 0.5rem;
    padding: 0.85rem 1rem;
    margin: 0 0 1.25rem;
    font-weight: 700;
    font-size: 0.92rem;
    display:none;
  }
  .form-status.is-visible{ display:block; }
  .form-status.success{
    background: rgba(75,93,58,0.12);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .form-status.error{
    background: rgba(178,58,30,0.1);
    color: var(--focus-ring);
    border: 1px solid var(--focus-ring);
  }
  .form-status.loading{
    background: var(--bg-alt);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .login-divider{
    display:flex;
    align-items:center;
    gap: 0.85rem;
    margin: 1.75rem 0 1.25rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .login-divider::before,
  .login-divider::after{
    content: "";
    flex: 1 1 auto;
    height: 1px;
    background: var(--border);
  }

  .login-signup{
    text-align: center;
    margin: 0;
    font-size: 0.92rem;
    color: var(--text-muted);
  }

  /* ===== 푸터 (최소 정보만) ===== */
  .site-footer{
    background: var(--footer-bg);
    color: var(--footer-text-muted);
    padding: 1.75rem 0;
    font-size: 0.85rem;
    --focus-ring: #FFFFFF;
  }
  .site-footer .container{
    max-width: 64rem;
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .site-footer a{ color: var(--footer-text); }
</style>
</head>
<body>

<a class="skip-link" href="#main-content">본문 바로가기</a>

<header class="site-header">
  <div class="util-bar">
    <div class="container">
      <span id="text-size-label" class="sr-only">글자 크기 조절</span>
      <button type="button" class="util-btn" id="font-decrease" aria-describedby="text-size-label">
        <span aria-hidden="true">가−</span><span class="sr-only">글자 작게</span>
      </button>
      <span id="font-size-status" class="util-status" role="status" aria-live="polite">글자 크기 100%</span>
      <button type="button" class="util-btn" id="font-increase" aria-describedby="text-size-label">
        <span aria-hidden="true">가+</span><span class="sr-only">글자 크게</span>
      </button>
      <button type="button" class="util-btn" id="font-reset">글자 크기 초기화</button>
      <button type="button" class="util-btn" id="contrast-toggle" aria-pressed="false">고대비 모드</button>
    </div>
  </div>

  <div class="header-inner">
    <a class="logo" href="index.html" aria-label="오후정미소, 홈으로 이동">
      오후정미소 <span class="logo-sub">Ohu Jeongmiso</span>
    </a>
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      홈으로 돌아가기
    </a>
  </div>
</header>

<main id="main-content" tabindex="-1">
  <div class="login-section">
    <div class="container">
      <div class="login-card">
        <p class="eyebrow">LOGIN</p>
        <h1>로그인</h1>
        <p class="login-lede">오후정미소 계정으로 로그인하고 찜한 메뉴와 주문 내역을 확인하세요.</p>

        <p id="login-status" class="form-status" role="status" aria-live="polite"></p>

        <form id="login-form" novalidate>
          <div class="form-row">
            <label for="login-email">이메일 주소 <span class="required-mark" aria-hidden="true">*</span><span class="sr-only">(필수 입력)</span></label>
            <input type="email" id="login-email" name="email" autocomplete="username" placeholder="you@example.com" aria-required="true" aria-describedby="login-email-hint">
            <span id="login-email-hint" class="hint">가입할 때 사용한 이메일 주소를 입력해 주세요.</span>
          </div>

          <div class="form-row">
            <label for="login-password">비밀번호 <span class="required-mark" aria-hidden="true">*</span><span class="sr-only">(필수 입력)</span></label>
            <div class="password-field">
              <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="최소 6자 이상, 숫자와 특수문자 포함" aria-required="true">
              <button type="button" class="password-toggle" id="password-toggle" aria-pressed="true" aria-label="비밀번호 숨기기">
                <svg class="pw-icon-show icon-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/>
                </svg>
                <svg class="pw-icon-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  <path d="M10.6 5.2C11 5.1 11.5 5 12 5c6.4 0 10 7 10 7-.6 1.1-1.7 2.6-3.3 3.9M6.6 6.6C4.4 8 3 10 2 12c0 0 3.6 7 10 7 1.4 0 2.7-.3 3.8-.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-row-inline">
            <label class="checkbox-row" for="login-remember">
              <input type="checkbox" id="login-remember" name="remember">
              <span>로그인 상태 유지</span>
            </label>
            <button type="button" class="link-btn" id="forgot-password-btn">비밀번호를 잊으셨나요?</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">로그인</button>
        </form>

        <p class="login-divider"><span>또는</span></p>

        <p class="login-signup">
          아직 계정이 없으신가요?
          <button type="button" class="link-btn" id="signup-btn">회원가입</button>
        </p>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" role="contentinfo">
  <div class="container">
    <p>&copy; 2026 오후정미소. All rights reserved.</p>
    <a href="index.html">홈으로</a>
  </div>
</footer>

<script>
(function(){
  "use strict";

  /* ---------- 글자 크기 조절 (메인 페이지와 동일한 동작 + aria-live 안내) ---------- */
  var root = document.documentElement;
  var step = 0;
  var MIN = -2, MAX = 3;
  var fontStatus = document.getElementById('font-size-status');

  function announceFontSize(extraNote){
    var percent = Math.round((1 + step * 0.1) * 100);
    var message = '글자 크기 ' + percent + '%';
    if(extraNote){ message += ' — ' + extraNote; }
    fontStatus.textContent = '';
    window.setTimeout(function(){ fontStatus.textContent = message; }, 30);
  }
  function applyScale(){
    root.style.setProperty('--scale', (1 + step * 0.1).toFixed(2));
  }
  document.getElementById('font-increase').addEventListener('click', function(){
    if(step < MAX){ step++; applyScale(); announceFontSize(); }
    else{ announceFontSize('더 이상 크게 조절할 수 없습니다'); }
  });
  document.getElementById('font-decrease').addEventListener('click', function(){
    if(step > MIN){ step--; applyScale(); announceFontSize(); }
    else{ announceFontSize('더 이상 작게 조절할 수 없습니다'); }
  });
  document.getElementById('font-reset').addEventListener('click', function(){
    step = 0; applyScale(); announceFontSize('기본값으로 초기화되었습니다');
  });

  /* ---------- 고대비 모드 ---------- */
  var contrastBtn = document.getElementById('contrast-toggle');
  contrastBtn.addEventListener('click', function(){
    var isHigh = root.getAttribute('data-contrast') === 'high';
    if(isHigh){
      root.removeAttribute('data-contrast');
      contrastBtn.setAttribute('aria-pressed', 'false');
    } else {
      root.setAttribute('data-contrast', 'high');
      contrastBtn.setAttribute('aria-pressed', 'true');
    }
  });

  /* ---------- 비밀번호 표시/숨기기 ----------
     전환 버튼(aria-pressed)의 대체텍스트는 절대 바뀌지 않는 고정값 "비밀번호 숨기기"로 두고,
     현재 가려짐/보임 상태는 aria-pressed 값 하나로만 전달한다.
     (대체텍스트와 눌림 상태를 동시에 바꾸면 "무엇을 누른 결과인지"와 "지금 상태"가 뒤섞여
     스크린리더 사용자가 헷갈리기 쉽다.)
     아이콘도 '다음에 어떤 동작을 할지'가 아니라 '지금 어떤 상태인지'를 보여준다:
     가려진 상태 = 대각선이 그어진 눈 아이콘, 보이는 상태 = 일반 눈 아이콘. */
  var pwInput = document.getElementById('login-password');
  var pwToggle = document.getElementById('password-toggle');
  var pwShowIcon = pwToggle.querySelector('.pw-icon-show'); // 일반 눈: '보임' 상태
  var pwHideIcon = pwToggle.querySelector('.pw-icon-hide'); // 대각선 그어진 눈: '가려짐' 상태

  function syncPasswordToggleUI(){
    var isHidden = pwInput.type === 'password';
    pwToggle.setAttribute('aria-pressed', String(isHidden));
    pwShowIcon.classList.toggle('icon-off', isHidden);
    pwHideIcon.classList.toggle('icon-off', !isHidden);
  }

  pwToggle.addEventListener('click', function(){
    pwInput.type = (pwInput.type === 'password') ? 'text' : 'password';
    syncPasswordToggleUI();
  });

  syncPasswordToggleUI(); // 초기 상태(가려짐)를 정확히 반영해둔다

  /* ---------- 아직 없는 기능(비밀번호 찾기 / 회원가입)에 대한 정직한 안내 ---------- */
  var loginStatus = document.getElementById('login-status');
  function showStatus(text, type){
    loginStatus.textContent = text;
    loginStatus.className = 'form-status is-visible ' + type;
  }
  document.getElementById('forgot-password-btn').addEventListener('click', function(){
    showStatus('비밀번호 재설정 기능은 준비 중입니다. 조금만 기다려 주세요.', 'loading');
  });
  document.getElementById('signup-btn').addEventListener('click', function(){
    showStatus('회원가입 페이지는 준비 중입니다. 조금만 기다려 주세요.', 'loading');
  });

  /* ---------- 로그인 폼 검증 + 백엔드 없는 프런트엔드 전용 임시 처리 ---------- */
  var form = document.getElementById('login-form');
  var emailField = document.getElementById('login-email');
  var submitBtn = document.getElementById('login-submit-btn');

  function clearFieldError(field){
    field.removeAttribute('aria-invalid');
    var err = document.getElementById(field.id + '-error');
    if(err){ err.parentNode.removeChild(err); }
  }
  function setFieldError(field, message){
    field.setAttribute('aria-invalid', 'true');
    var existing = document.getElementById(field.id + '-error');
    if(!existing){
      existing = document.createElement('span');
      existing.id = field.id + '-error';
      existing.className = 'error-text';
      existing.setAttribute('role', 'alert');
      // 비밀번호 필드는 보기/숨기기 버튼과 같은 줄(.password-field)에 있으므로,
      // 오류 메시지는 그 줄 전체 다음에 붙여야 레이아웃이 어긋나지 않는다.
      var anchor = field.closest('.password-field') || field;
      anchor.insertAdjacentElement('afterend', existing);
    }
    existing.innerHTML = '<span aria-hidden="true">⚠</span> ' + message;
    var describedBy = field.getAttribute('aria-describedby') || '';
    if(describedBy.indexOf(existing.id) === -1){
      field.setAttribute('aria-describedby', (describedBy + ' ' + existing.id).trim());
    }
  }
  function isValidEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    clearFieldError(emailField);
    clearFieldError(pwInput);
    loginStatus.className = 'form-status';
    loginStatus.textContent = '';

    var firstInvalid = null;

    if(emailField.value.trim() === ''){
      setFieldError(emailField, '이메일 주소를 입력해 주세요.');
      firstInvalid = firstInvalid || emailField;
    } else if(!isValidEmail(emailField.value.trim())){
      setFieldError(emailField, '올바른 이메일 주소 형식으로 입력해 주세요. 예: name@example.com');
      firstInvalid = firstInvalid || emailField;
    }

    if(pwInput.value === ''){
      setFieldError(pwInput, '비밀번호를 입력해 주세요.');
      firstInvalid = firstInvalid || pwInput;
    }

    if(firstInvalid){
      showStatus('입력 내용을 다시 확인해 주세요. 오류가 있는 항목이 있습니다.', 'error');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      firstInvalid.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
      firstInvalid.focus({ preventScroll: true });
      return;
    }

    // 아직 백엔드가 없으므로, 실제 인증 대신 처리 중 상태만 잠깐 보여준 뒤 완료를 안내한다.
    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중입니다…';
    showStatus('로그인 정보를 확인하고 있습니다.', 'loading');

    window.setTimeout(function(){
      submitBtn.disabled = false;
      submitBtn.textContent = '로그인';
      showStatus(emailField.value.trim() + ' 계정으로 로그인되었습니다. (프런트엔드 시연용으로, 실제 인증은 아직 연결되지 않았습니다.)', 'success');
    }, 900);
  });
})();
</script>

</body>
</html>
